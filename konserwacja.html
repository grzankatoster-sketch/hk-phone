<script>
/* Ekran prywatności: przy zejściu aplikacji w tło (przełącznik aplikacji,
   powiadomienia, blokada telefonu) treść jest natychmiast zasłaniana, żeby
   system nie mógł jej pokazać w miniaturce podglądu — przeglądarka nie ma
   API blokującego sam zrzut ekranu, więc to jedyna realna ochrona (tak jak
   w aplikacjach bankowych). */
(function(){
  var shield;
  function ensure(){
    if (shield || !document.body) return shield;
    shield = document.createElement("div");
    shield.id = "privacy-shield";
    shield.innerHTML =
      '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">' +
      '<path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"/><path d="M9.5 12.2 11.3 14l3.4-3.6"/></svg>' +
      '<div>Zawartość ukryta<br/>ze względów bezpieczeństwa</div>';
    var st = document.createElement("style");
    st.textContent =
      "#privacy-shield{position:fixed;inset:0;z-index:2147483647;display:none;flex-direction:column;" +
      "align-items:center;justify-content:center;gap:14px;background:#0B0810;" +
      "backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#B065A0;" +
      "font-family:Outfit,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;padding:24px}" +
      "#privacy-shield.show{display:flex}" +
      "#privacy-shield div{font-size:13px;font-weight:600;color:#A89DAE;max-width:220px;line-height:1.5}";
    document.head.appendChild(st);
    document.body.appendChild(shield);
    return shield;
  }
  function show(){ var el = ensure(); if (el) el.classList.add("show"); }
  function hide(){ if (shield) shield.classList.remove("show"); }
  document.addEventListener("visibilitychange", function(){ if (document.hidden) show(); else hide(); });
  window.addEventListener("blur", show);
  window.addEventListener("focus", hide);
  window.addEventListener("pagehide", show);
  document.addEventListener("keyup", function(e){ if (e.key === "PrintScreen"){ show(); setTimeout(hide, 1200); } });
})();
</script>
<script>
/* Appka natywna (Capacitor): FLAG_SECURE na Androidzie realnie blokuje zrzuty
   ekranu i nagrywanie (nie tylko podgląd w tle jak zasłona wyżej). W zwykłej
   przeglądarce window.Capacitor nie istnieje — blok jest no-opem i powyższa
   zasłona CSS zostaje jedyną ochroną (na iOS to i tak tylko blur w tle, nie
   blokada samego zrzutu — Apple na to nie pozwala nikomu). */
(function(){
  try {
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
      var ps = window.Capacitor.Plugins && window.Capacitor.Plugins.PrivacyScreen;
      if (ps && ps.enable){
        ps.enable({
          android: { preventScreenshots: true, privacyModeOnActivityHidden: "splash" },
          ios: { blurEffect: "dark" }
        });
      }
    }
  } catch (e) {}
})();
</script>
<script>
/* Motyw ustawiany PRZED pierwszym malowaniem strony, żeby uniknąć "błysku" złego
   motywu. Domyślnie CIEMNY — praca w terenie/słabe światło, jasny to świadoma opcja
   (localStorage "kons_theme"="light"). */
(function(){
  try{
    var t = localStorage.getItem("kons_theme");
    document.documentElement.classList.toggle("dark", t !== "light");
  }catch(e){ document.documentElement.classList.add("dark"); }
})();
</script>

<script>
/* Auto-aktualizacja: gdy na serwerze pojawi się nowa wersja strony, aplikacja
   dodana do ekranu głównego (standalone PWA) sama się przeładuje — nie trzeba
   jej zamykać ani usuwać i dodawać ponownie. */
(function(){
  var url = location.pathname + (location.search || "");
  var baseline = null, busy = false, INTERVAL = 5 * 60 * 1000;
  function fp(s){ var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return s.length + ":" + h; }
  async function check(){
    if (busy || navigator.onLine === false) return;
    busy = true;
    try {
      var res = await fetch(url, { cache: "no-store" });
      if (res.ok){
        var cur = fp(await res.text());
        if (baseline === null) baseline = cur;
        else if (cur !== baseline){ location.reload(); return; }
      }
    } catch (e) { /* offline / chwilowy błąd — sprawdzimy później */ }
    busy = false;
  }
  if ("serviceWorker" in navigator)
    navigator.serviceWorker.getRegistration().then(function(r){ if (r) r.update(); }).catch(function(){});
  check();
  setInterval(function(){ if (!document.hidden) check(); }, INTERVAL);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) check(); });
})();
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --plum:#5a1d4a;
  --plum-soft:#7a3a6a;
  --cream:#fdfaf7;
  --paper:#ffffff;
  --ink:#2d1422;
  --muted:#8a6a7e;
  --line:rgba(90,29,74,.14);
  --line-strong:rgba(90,29,74,.28);
  --tint:rgba(90,29,74,.06);
  --green:#0f7a4a;
  --amber:#a07820;
  --red:#b3261e;
  /* "-ink" = kolor TEKSTU na przyciemnionym/przezroczystym tle (odznaki, "Ty").
     W jasnym motywie to te same barwy co wypełnienia — w ciemnym dostają jaśniejsze
     warianty (patrz html.dark), bo ciemne barwy giną na ciemnym tle. Wypełnienia
     przycisków (--plum/--green/--amber/--red) zostają BEZ ZMIAN w obu motywach —
     są już wystarczająco ciemne, by biały tekst miał dobry kontrast niezależnie od tła. */
  --plum-ink:#5a1d4a;
  --green-ink:#0f7a4a;
  --amber-ink:#a07820;
  --red-ink:#b3261e;
}
html.dark{
  color-scheme:dark;
  --cream:#0B0810;
  --paper:#17131F;
  --ink:#F0E8DC;
  --muted:#A89DAE;
  --line:#2A2334;
  --line-strong:#3A3144;
  --tint:rgba(176,101,160,.12);
  --plum-ink:#B065A0;
  --green-ink:#2BD4A0;
  --amber-ink:#F4C055;
  --red-ink:#FF5471;
}
html,body{background:var(--cream);transition:background .2s ease}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);min-height:100vh}
.header{background:var(--plum);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--plum);position:sticky;top:0;z-index:10}
.header h1{font-size:17px;font-weight:800;flex:1;color:#fff}
.tabs{display:flex;gap:6px;padding:10px 12px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:9;overflow-x:auto}
.tab-btn{padding:7px 14px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:12px;font-weight:700;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab-btn.active{background:var(--plum);border-color:var(--plum);color:#fff}
.tab-btn.sec{font-weight:800;display:inline-flex;align-items:center;gap:5px}
.tab-btn.sec.active{box-shadow:0 0 0 2px rgba(90,29,74,.2)}
.tab-btn.tab-urgent{color:var(--red-ink);border-color:rgba(255,84,113,.4)}
.tab-btn.tab-urgent.active{background:var(--red);border-color:var(--red);color:#fff}
.tab-sep{flex:0 0 auto;width:1px;align-self:stretch;background:var(--line-strong);margin:2px 5px}
.list{padding:12px 12px 60px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;border-left-width:4px;box-shadow:0 1px 2px rgba(90,29,74,.04)}
.card.open{border-left-color:var(--red)}
.card.in_progress{border-left-color:var(--amber)}
.card.done{border-left-color:var(--green);opacity:.8}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.room{font-size:20px;font-weight:900;letter-spacing:-.02em}
.badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.badge.open{background:rgba(179,38,30,.12);color:var(--red-ink)}
.badge.in_progress{background:rgba(160,120,32,.14);color:var(--amber-ink)}
.badge.done{background:rgba(15,122,74,.12);color:var(--green-ink)}
.sla{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.sla.ok{background:var(--tint);color:var(--muted)}
.sla.soon{background:rgba(160,120,32,.14);color:var(--amber-ink)}
.sla.over{background:rgba(179,38,30,.16);color:var(--red-ink)}

.sla-bar{height:3px;border-radius:2px;background:var(--tint);overflow:hidden;margin:0 0 9px}
.sla-bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.sla-bar-fill.over,.sla-bar-fill.soon{background:var(--red-ink)}
.sla-bar-fill.ok{background:var(--green-ink)}

.theme-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0;font-family:inherit}
.theme-btn:hover{background:rgba(255,255,255,.22)}
.src{font-size:10px;font-weight:700;color:var(--muted);background:var(--tint);padding:2px 7px;border-radius:999px;margin-left:auto}
.desc{font-size:14px;line-height:1.5;margin:6px 0 8px;white-space:pre-wrap}
.meta{font-size:11px;color:var(--muted);margin-bottom:10px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.thumb{width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.act{flex:1;min-width:120px;padding:10px;border-radius:9px;border:none;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.act-toku{background:var(--amber);color:#fff}
.act-done{background:var(--green);color:#fff}
.act:active{opacity:.75}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-icon{display:flex;justify-content:center;color:var(--muted);margin-bottom:12px}
.loading{display:flex;align-items:center;justify-content:center;height:50vh;flex-direction:column;gap:12px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--plum);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;padding:12px 20px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 8px 30px rgba(90,29,74,.25);transition:opacity .3s}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.kons-av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#fff;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.25)}

.assignee.me{background:var(--plum);color:#fff;border-color:var(--plum)}

</style>

applyTheme(document.documentElement.classList.contains("dark") ? "dark" : "light");
const TENANT_ID = "00000000-0000-0000-0000-000000000001"; // = VITE_TENANT_ID recepcji

let alertsOpen = false;
let prevUrgentCount = null;

// ── Pilność SLA — bucket + sortowanie, żeby najpilniejsze zawsze były na górze. ──
const H_MS = 3600000;
function urgencyOf(f){
  const st = f.status||"open";
  if (st==="done") return { bucket:"done", ms:Infinity };
  if (!f.due_at) return { bucket:"none", ms:Infinity };
  const diff = new Date(f.due_at).getTime() - Date.now();
  if (diff<=0) return { bucket:"overdue", ms:diff };
  if (diff<=H_MS) return { bucket:"critical", ms:diff };
  if (diff<=4*H_MS) return { bucket:"warn", ms:diff };
  return { bucket:"ok", ms:diff };
}
const BUCKET_ORDER = { overdue:0, critical:1, warn:2, ok:3, none:4, done:5 };
function sortByUrgency(list){
  return list.slice().sort((a,b)=>{
    const ua=urgencyOf(a), ub=urgencyOf(b);
    if (BUCKET_ORDER[ua.bucket]!==BUCKET_ORDER[ub.bucket]) return BUCKET_ORDER[ua.bucket]-BUCKET_ORDER[ub.bucket];
    if (ua.bucket==="none") return new Date(b.reported_at||0)-new Date(a.reported_at||0);
    return ua.ms-ub.ms;
  });
}
function isUrgent(f){ const b=urgencyOf(f).bucket; return b==="overdue"||b==="critical"; }
function urgentFaults(){ return faults.filter(isUrgent); }

// ── FLIP: płynne przesunięcie kart przy zmianie kolejności (sortowanie wg pilności). ──
function withFlip(paintFn){
  const before = new Map();
  document.querySelectorAll('#app [data-fid]').forEach(el=>{ before.set(el.dataset.fid, el.getBoundingClientRect()); });
  paintFn();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  requestAnimationFrame(()=>{
    document.querySelectorAll('#app [data-fid]').forEach(el=>{
      const old = before.get(el.dataset.fid);
      if (!old) return;
      const now = el.getBoundingClientRect();
      const dy = old.top - now.top;
      if (Math.abs(dy) < 1) return;
      el.style.transition = "none";
      el.style.transform = `translateY(${dy}px)`;
      requestAnimationFrame(()=>{
        el.style.transition = "transform .35s cubic-bezier(.22,1,.36,1)";
        el.style.transform = "";
      });
    });
  });
}

// Czy ten plan dotyczy zalogowanej osoby: przypisany do niej lub jeszcze nieprzypisany (widzą obaj).
function planForMe(p){
  const a = (p.assigned_to||"").trim();
  if (!a) return true;
  if (!KNOWN) return true;
  return a.toLowerCase().split(/\s*,\s*/).includes(WHO.toLowerCase());
}
// Aktywne plany widoczne dla tej osoby.
function visiblePlans(){ return mplans.filter(p => p.status!=="done" && planForMe(p)); }
function tasksOf(id){ return plan.filter(t => t.plan_id===id); }
// Liczba niezakończonych zadań w moich planach (badge na zakładce Plan).
function myOpenTaskCount(){
  const ids = new Set(visiblePlans().map(p=>p.id));
  return plan.filter(t => ids.has(t.plan_id) && (t.status||"open")!=="done").length;
}

function toast(msg,color="var(--green)"){ const e=document.createElement("div");e.className="toast";e.style.color=color;e.textContent=msg;document.body.appendChild(e);setTimeout(()=>{e.style.opacity="0";setTimeout(()=>e.remove(),300);},2000); }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtDate(iso){ try{ return new Date(iso).toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch{ return ""; } }
function fmtDay(iso){ try{ return new Date(iso+"T00:00:00").toLocaleDateString("pl-PL",{weekday:"short",day:"2-digit",month:"2-digit"}); }catch{ return String(iso||""); } }
function fmtDur(min){ if (min<60) return min+" min"; const h=Math.floor(min/60), m=min%60; return h+" godz"+(m?" "+m+" min":""); }
// SLA (due_at, migracja 0043) — badge tekstowy + pasek wizualny upływu czasu.
function slaBadge(f){
  if (!f.due_at || f.status==="done") return "";
  const diffMin = Math.round((new Date(f.due_at).getTime() - Date.now())/60000);
  if (diffMin < 0)   return `<span class="sla over">Po terminie o ${esc(fmtDur(-diffMin))}</span>`;
  if (diffMin < 60)  return `<span class="sla soon">Zostało ${diffMin} min</span>`;
  return `<span class="sla ok">Termin: ${esc(fmtDate(f.due_at))}</span>`;
}
function slaBar(f){
  if (!f.due_at || f.status==="done") return "";
  const start = new Date(f.reported_at||f.created_at||Date.now()).getTime();
  const due = new Date(f.due_at).getTime();
  const total = due - start;
  const pct = total>0 ? Math.max(4, Math.min(100, ((Date.now()-start)/total)*100)) : 100;
  const cls = urgencyOf(f).bucket==="overdue" ? "over" : (urgencyOf(f).bucket==="critical" ? "soon" : "ok");
  return `<div class="sla-bar"><div class="sla-bar-fill ${cls}" style="width:${pct}%"></div></div>`;
}
function openImg(url){ document.getElementById("lightbox-img").src=url; document.getElementById("lightbox").classList.add("open"); }
function photosOf(f){ const a=[...(f.photos||[])]; if(f.photo_url&&!a.includes(f.photo_url)) a.unshift(f.photo_url); return a; }
function locOf(f){ return f.room || f.space_id || "—"; }
// Kto odpowiedzialny: przypisany konserwator (np. „👤 Kamil"), „Ty" gdy to zalogowana
// osoba, albo „👥 Wszyscy" gdy brak przypisania (kategoria spoza podziału specjalności).
function assignChip(f){
  const who = (f.assigned_to||"").trim();
  if (!who) return `<span class="assignee all">${_ic(P_USERS,11)} Wszyscy</span>`;
  if (KNOWN && who.toLowerCase()===WHO.toLowerCase()) return `<span class="assignee me">${_ic(P_USER,11)} Ty</span>`;
  return `<span class="assignee">${_ic(P_USER,11)} ${esc(who)}</span>`;
}

function renderTabs(){
  // Górny poziom: sekcja (Usterki / Plan) z licznikiem niezakończonych.
  const secBtns = [["faults",_ic(P_WRENCH,14)+" Usterki"],["plan",_ic(P_LIST,14)+" Plan"]].map(([k,l])=>{
    const n = k==="faults"
      ? faults.filter(f=>(f.status||"open")!=="done").length
      : myOpenTaskCount();
    return `<button class="tab-btn sec${section===k?" active":""}" onclick="setSection('${k}')">${l}${n?` (${n})`:""}</button>`;
  }).join("");
  // Dolny poziom: filtry statusu. W sekcji Plan tylko wewnątrz otwartego planu.
  let subBtns = "";
  if (section==="faults"){
    subBtns = FILTERS.map(([k,l])=>{
      const n = k==="all" ? faults.length : (k==="urgent" ? urgentFaults().length : faults.filter(f=>(f.status||"open")===k).length);
      return `<button class="tab-btn${filter===k?" active":""}${k==="urgent"?" tab-urgent":""}" onclick="setFilter('${k}')">${l}${n?` (${n})`:""}</button>`;
    }).join("");
  } else if (planOpenId){
    const mine = tasksOf(planOpenId);
    subBtns = PLAN_FILTERS.map(([k,l])=>{
      const n = k==="all" ? mine.length : mine.filter(p=>(p.status||"open")===k).length;
      return `<button class="tab-btn${planFilter===k?" active":""}" onclick="setPlanFilter('${k}')">${l}${n?` (${n})`:""}</button>`;
    }).join("");
  }
  document.getElementById("tabs").innerHTML = secBtns + `<span class="tab-sep"></span>` + subBtns;
  renderUrgentHeader();
}

// Pigułka "N pilne" w headerze — klik rozwija skróconą listę, tap w wiersz filtruje do "Pilne".
function renderUrgentHeader(){
  const n = urgentFaults().length;
  let pill = document.getElementById("urgentPill");
  if (n>0){
    if (!pill){
      pill = document.createElement("button");
      pill.id = "urgentPill"; pill.className = "urgent-pill"; pill.onclick = toggleAlerts;
      document.getElementById("konsHeader").appendChild(pill);
    }
    const changed = prevUrgentCount!==null && prevUrgentCount!==n;
    pill.innerHTML = `${_ic(P_WARN,13)} ${n} pilne`;
    if (changed){ pill.classList.remove("bump"); void pill.offsetWidth; pill.classList.add("bump"); }
  } else if (pill){
    pill.remove();
  }
  prevUrgentCount = n;
  const list = document.getElementById("alertlist");
  list.classList.toggle("show", alertsOpen && n>0);
  if (alertsOpen && n>0){
    list.innerHTML = sortByUrgency(urgentFaults()).map(f =>
      `<button class="alert-row" onclick="jumpToUrgent('${f.id}')">${esc(locOf(f))} — ${esc(urgencyOf(f).bucket==="overdue"?"po terminie":"pilne")}</button>`
    ).join("");
  }
}
window.toggleAlerts = () => { alertsOpen = !alertsOpen; renderUrgentHeader(); };
window.jumpToUrgent = (id) => {
  alertsOpen = false; section = "faults"; filter = "urgent"; render();
  requestAnimationFrame(() => document.querySelector(`[data-fid="${id}"]`)?.scrollIntoView({behavior:"smooth", block:"center"}));
};
function setSection(k){ section=k; render(); }
function setFilter(k){ filter=k; render(); }
function setPlanFilter(k){ planFilter=k; render(); }

function render(){
  renderTabs();
  if (section==="plan") return renderPlan();
  withFlip(() => {
    const base = filter==="all" ? faults : (filter==="urgent" ? urgentFaults() : faults.filter(f=>(f.status||"open")===filter));
    const list = sortByUrgency(base);
    if (!list.length){ app.innerHTML = `<div class="empty"><div class="empty-icon">${_ic(P_CHECKBIG,32)}</div><div>Brak usterek w tej kategorii.</div></div>`; return; }
    let html = `<div class="list">`;
    list.forEach(f=>{
      const st = f.status||"open";
      const photos = photosOf(f);
      html += `<div class="card ${st}${flashId===f.id?" flash":""}" data-fid="${f.id}">
        <div class="card-top">
          <div class="room">${esc(locOf(f))}</div>
          <span class="badge ${st}">${STATUS[st]||st}</span>
          ${slaBadge(f)}
          <span class="src">${f.source==="hk"?"HK":"recepcja"}</span>
        </div>
        ${slaBar(f)}
        <div class="desc">${esc(f.description)}</div>
        <div class="assign-row">${assignChip(f)}${f.category?`<span class="cat-chip">${esc(f.category)}</span>`:""}</div>
        <div class="meta">${esc(f.reported_by||"—")} · ${fmtDate(f.reported_at||f.created_at)}${f.resolved_by?` · naprawił: ${esc(f.resolved_by)}`:""}</div>`;
      if (photos.length){
        html += `<div class="thumbs">` + photos.map(p=>`<div class="thumb" onclick="openImg('${esc(p)}')"><img src="${esc(p)}" loading="lazy"/></div>`).join("") + `</div>`;
      }
      html += `<div class="actions">`;
      if (st==="open")     html += `<button class="act act-toku" onclick="setStatus('${f.id}','in_progress')">▶ Zaczynam naprawę</button>`;
      if (st!=="done")     html += `<button class="act act-done" onclick="setStatus('${f.id}','done')">${_ic(P_CHECK,13)} Naprawione — zakończ</button>`;
      html += `</div></div>`;
    });
    html += `</div>`;
    app.innerHTML = html;
    flashId = null;
  });
}

async function setStatus(id, status){
  const patch = { status };
  if (status==="done"){ patch.resolved_by = WHO; patch.resolved_at = new Date().toISOString(); }
  const { error } = await sb.from("faults").update(patch).eq("id", id);
  if (error){ toast("Błąd: "+error.message,"var(--red)"); return; }
  const f = faults.find(x=>x.id===id); if (f) Object.assign(f, patch);
  toast(status==="done"?"Oznaczono jako naprawione ✓":"Status: w toku","var(--green)");
  flashId = id;
  render();
}

// ── Plan: lista moich planów → zadania (odpowiedź + zdjęcie zmian) ──
function renderPlan(){
  if (!planOpenId) return renderPlanList();
  const p = mplans.find(x=>x.id===planOpenId);
  if (!p){ planOpenId=null; return renderPlanList(); }
  let list = tasksOf(p.id);
  if (planFilter!=="all") list = list.filter(t=>(t.status||"open")===planFilter);
  // Niezakończone na górze; w obrębie statusu — z terminem wg dnia, bez terminu na końcu.
  list = list.slice().sort((a,b)=>{
    const ad=(a.status==="done"), bd=(b.status==="done");
    if (ad!==bd) return ad?1:-1;
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1; if (!b.date) return -1;
    return String(a.date).localeCompare(String(b.date));
  });
  const head = `<div style="padding:10px 12px 0"><button class="tab-btn" onclick="backPlan()">← Plany</button>
    <div style="font-size:17px;font-weight:900;margin:8px 2px 2px;display:flex;align-items:center;gap:7px">${_ic(P_LIST,17)} ${esc(p.name)}</div></div>`;
  const body = list.length ? `<div class="list">`+list.map(planTaskCard).join("")+`</div>`
    : `<div class="empty"><div class="empty-icon">${_ic(P_LIST,32)}</div><div>Brak zadań w tej kategorii.</div></div>`;
  app.innerHTML = head + body;
}
function renderPlanList(){
  const list = visiblePlans();
  if (!list.length){ app.innerHTML = `<div class="empty"><div class="empty-icon">${_ic(P_LIST,32)}</div><div>Brak planów dla Ciebie.</div></div>`; return; }
  let html = `<div class="list">`;
  list.forEach(p=>{
    const ts = tasksOf(p.id);
    const open = ts.filter(t=>(t.status||"open")!=="done").length;
    html += `<div class="card open" style="cursor:pointer" onclick="openPlanK('${p.id}')">
      <div class="card-top">
        <div class="room" style="font-size:16px;flex:1">${esc(p.name)}</div>
        <span class="badge ${open?'open':'done'}">${open?open+" do zrobienia":"wszystko gotowe"}</span>
      </div>
      <div class="assign-row">${assignChip(p)}<span class="cat-chip">${ts.length} zadań</span></div>
    </div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
}
function planTaskCard(t){
  const done = (t.status||"open")==="done";
  const photos = Array.isArray(t.photos)?t.photos:[];
  return `<div class="card ${done?"done":"open"}">
    <div class="card-top">
      <div class="desc" style="flex:1;margin:0;font-weight:700;${done?"text-decoration:line-through":""}">${esc(t.task)}</div>
      <span class="badge ${done?"done":"open"}">${done?"Wykonane":"Do zrobienia"}</span>
    </div>
    <div class="assign-row">${t.room?`<span class="cat-chip">${_ic(P_DOOR,11)} ${esc(t.room)}</span>`:""}<span class="cat-chip">${t.date?_ic(P_CALENDAR,11)+" "+esc(fmtDay(t.date)):"bez terminu"}</span></div>
    ${t.response?`<div class="desc" style="background:rgba(15,122,74,.06);border:1px solid rgba(15,122,74,.25);border-radius:8px;padding:8px 10px;font-size:13px">${_ic(P_CHAT,13)} ${esc(t.response)}</div>`:""}
    ${photos.length?`<div class="thumbs">`+photos.map(u=>`<div class="thumb" onclick="openImg('${esc(u)}')"><img src="${esc(u)}" loading="lazy"/></div>`).join("")+`</div>`:""}
    <div class="actions">
      ${done?`<button class="act" style="background:var(--tint);color:var(--muted)" onclick="planUndo('${t.id}')">↩ Cofnij</button>`
            :`<button class="act act-done" onclick="planDone('${t.id}')">${_ic(P_CHECK,13)} Wykonane</button>`}
      <button class="act act-toku" onclick="planPhoto('${t.id}')">${_ic(P_CAMERA,13)} Zdjęcie</button>
      <button class="act" style="background:var(--tint);color:var(--plum)" onclick="planRespond('${t.id}')">${_ic(P_CHAT,13)} Odpowiedź</button>
    </div>
  </div>`;
}
function openPlanK(id){ planOpenId=id; planFilter="open"; render(); }
function backPlan(){ planOpenId=null; render(); }

window.planDone = async (id)=>{
  const { error } = await sb.from("panel_plan").update({ status:"done", updated_at:new Date().toISOString() }).eq("id", id);
  if (error){ toast("Błąd: "+error.message,"var(--red)"); return; }
  const t = plan.find(x=>x.id===id); if (t) t.status="done";
  toast("Zadanie wykonane ✓"); render();
};
window.planUndo = async (id)=>{
  const { error } = await sb.from("panel_plan").update({ status:"open", updated_at:new Date().toISOString() }).eq("id", id);
  if (error){ toast("Błąd: "+error.message,"var(--red)"); return; }
  const t = plan.find(x=>x.id===id); if (t) t.status="open";
  render();
};
window.planRespond = async (id)=>{
  const r = prompt("Odpowiedź / uwaga dla menedżera:");
  if (r==null) return;
  const { error } = await sb.from("panel_plan").update({ response:r, updated_at:new Date().toISOString() }).eq("id", id);
  if (error){ toast("Błąd: "+error.message,"var(--red)"); return; }
  const t = plan.find(x=>x.id===id); if (t) t.response=r;
  toast("Wysłano odpowiedź ✓"); render();
};
// Zdjęcie zmian — do bucketu hk-faults (anon insert), URL dopisany do panel_plan.photos.
window.planPhoto = (id)=>{
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
  inp.onchange = async ()=>{
    const file = inp.files && inp.files[0]; if (!file) return;
    toast("Wysyłam zdjęcie…","var(--plum)");
    try{
      const path = `plan/${id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const { error:upErr } = await sb.storage.from("hk-faults").upload(path, file, { contentType:file.type||"image/jpeg", upsert:false });
      if (upErr) throw upErr;
      const url = sb.storage.from("hk-faults").getPublicUrl(path).data.publicUrl;
      const t = plan.find(x=>x.id===id);
      const next = [...(Array.isArray(t&&t.photos)?t.photos:[]), url];
      const { error } = await sb.from("panel_plan").update({ photos:next, updated_at:new Date().toISOString() }).eq("id", id);
      if (error) throw error;
      if (t) t.photos = next;
      toast("Zdjęcie dodane ✓"); render();
    }catch(e){ toast("Błąd zdjęcia: "+((e&&e.message)||""),"var(--red)"); }
  };
  inp.click();
};

// Fallback do Realtime — co 12 s dociąga usterki, plany i zadania, by nowe pojawiały się
// bez ręcznego odświeżania, nawet gdy websocket nie dostarczy zdarzenia.
async function refreshFaults(){
  try{
    const [{ data:fx }, { data:mp }, { data:pl }] = await Promise.all([
      sb.from("faults").select("*").eq("tenant_id", TENANT_ID).order("reported_at",{ascending:false}),
      // group_id=null: plany z checklist (Kontrole) mają zostać TYLKO tam, nie dublować się tu.
      sb.from("maintenance_plans").select("*").eq("tenant_id", TENANT_ID).is("group_id", null).order("created_at",{ascending:false}),
      sb.from("panel_plan").select("*").eq("tenant_id", TENANT_ID).not("plan_id","is",null),
    ]);
    if (fx) faults = fx;
    if (mp) mplans = mp;
    if (pl) plan = pl;
    if (fx||mp||pl){ const y=window.scrollY; render(); window.scrollTo(0,y); }
  }catch(e){ /* sieć padła — spróbujemy za 12 s */ }
}

async function load(){
  const { data, error } = await sb.from("faults").select("*").eq("tenant_id", TENANT_ID).order("reported_at",{ascending:false});
  if (error){ app.innerHTML = `<div class="empty"><div class="empty-icon">${_ic(P_WARN,32)}</div><div>Błąd: ${esc(error.message)}</div></div>`; return; }
  faults = data||[];
  try {
    const [{ data:mp }, { data:pl }] = await Promise.all([
      // group_id=null: plany z checklist (Kontrole) mają zostać TYLKO tam, nie dublować się tu.
      sb.from("maintenance_plans").select("*").eq("tenant_id", TENANT_ID).is("group_id", null).order("created_at",{ascending:false}),
      sb.from("panel_plan").select("*").eq("tenant_id", TENANT_ID).not("plan_id","is",null),
    ]);
    mplans = mp||[]; plan = pl||[];
  } catch {}
  render();
  sb.channel("faults-konserwacja")
    .on("postgres_changes",{event:"*",schema:"public",table:"faults",filter:`tenant_id=eq.${TENANT_ID}`}, ({eventType,new:row,old})=>{
      if (eventType==="INSERT"){ faults=[row,...faults]; toast("Nowa usterka: "+(row.room||row.space_id||"—"),"var(--red)"); }
      else if (eventType==="UPDATE"){ faults=faults.map(f=>f.id===row.id?row:f); }
      else if (eventType==="DELETE"){ faults=faults.filter(f=>f.id!==old.id); }
      render();
    })
    .subscribe();
  sb.channel("plan-konserwacja")
    .on("postgres_changes",{event:"*",schema:"public",table:"panel_plan",filter:`tenant_id=eq.${TENANT_ID}`}, ({eventType,new:row,old})=>{
      if (eventType==="INSERT"){
        if (!row.plan_id) return;          // tylko zadania planów konserwacji
        plan=[row,...plan];
        const mp = mplans.find(x=>x.id===row.plan_id);
        if (mp && planForMe(mp)) toast("Nowe zadanie: "+(row.task||row.plan||"—"),"var(--plum)");
      }
      else if (eventType==="UPDATE"){ plan=plan.map(p=>p.id===row.id?row:p); }
      else if (eventType==="DELETE"){ plan=plan.filter(p=>p.id!==(old&&old.id)); }
      render();
    })
    .subscribe();
  sb.channel("mplans-konserwacja")
    .on("postgres_changes",{event:"*",schema:"public",table:"maintenance_plans",filter:`tenant_id=eq.${TENANT_ID}`}, ({eventType,new:row,old})=>{
      if (eventType==="INSERT"){ if (row.group_id) return; mplans=[row,...mplans]; if (planForMe(row)) toast("Nowy plan: "+(row.name||"—"),"var(--plum)"); }
      else if (eventType==="UPDATE"){ mplans=mplans.map(p=>p.id===row.id?row:p); }
      else if (eventType==="DELETE"){ mplans=mplans.filter(p=>p.id!==(old&&old.id)); }
      render();
    })
    .subscribe();
  if (!window.__konsPoll) window.__konsPoll = setInterval(refreshFaults, 12000);
}
load();
if (typeof mountPushButton === "function") {
  mountPushButton({ sb, tenant: TENANT_ID, worker: WHO, role: "konserwacja" });
}
if (typeof mountInstallPrompt === "function") setTimeout(mountInstallPrompt, 1500);
</script>
