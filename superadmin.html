<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Operator — Hotele</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{ --bg:#12141a; --panel:#1b1e27; --line:#2a2e3a; --ink:#e8eaf0; --muted:#9095a6;
    --accent:#5b8cff; --ok:#3ec27a; --bad:#e5566b; }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--ink); font:500 14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; }
  .wrap{ max-width:720px; margin:0 auto; padding:28px 16px 60px; }
  h1{ font-size:18px; font-weight:800; margin:0 0 4px }
  .sub{ color:var(--muted); font-size:12.5px; margin:0 0 20px }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px }
  .field{ margin-bottom:12px }
  label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px }
  .inp{ width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:#10121a; color:var(--ink); font-size:14px }
  .btn{ width:100%; padding:11px; border:none; border-radius:9px; background:var(--accent); color:#fff; font-weight:800; font-size:14px; cursor:pointer }
  .btn.small{ width:auto; padding:8px 11px; font-size:12px }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink) }
  .btn.danger{ background:var(--bad) }
  .btn.ok{ background:var(--ok) }
  .msg{ font-size:12.5px; margin-top:8px; min-height:1em }
  .msg.err{ color:var(--bad) }
  .msg.info{ color:var(--ok) }
  .row{ display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:10px }
  .hotel{ border-bottom:1px solid var(--line); padding:14px 0 }
  .hotel:last-child{ border-bottom:none }
  .hname{ font-weight:800; font-size:14.5px }
  .hmeta{ color:var(--muted); font-size:12px; margin-top:2px }
  .status{ font-weight:800; font-size:11px; padding:2px 8px; border-radius:99px; display:inline-block }
  .status.trial{ background:#2a2e3a; color:var(--muted) }
  .status.active{ background:rgba(62,194,122,.15); color:var(--ok) }
  .status.suspended{ background:rgba(229,86,107,.18); color:var(--bad) }
  .empty{ color:var(--muted); text-align:center; padding:20px }
  a.logout{ color:var(--muted); font-size:12px; float:right; cursor:pointer }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Ładowanie…</div></div>
<script>
// Panel operatora SaaS — OSOBNE okno od panel.html (produkt hotelowy).
// Wyłącznie rola 'superadmin' w app_accounts (patrz migracja 0056). Konto
// zakłada się WYŁĄCZNIE ręcznie przez SQL (patrz PANEL_DEPLOY.md) — żaden
// hotelowy 'admin' nie może sam sobie nadać tej roli.
const SB_URL = "https://pjgcaujndvjvicqsdcns.supabase.co";
const SB_KEY = "sb_publishable_h_uQ7-zzck71HIWxnlwTbQ_Io9m7wfb";
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const app = document.getElementById("app");
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const STATUS_LBL = { trial:"próba", active:"opłacony", suspended:"WYŁĄCZONY" };

// Klucze modułów licencjonowalnych — lustro MODULE_REGISTRY z src/lib/modules.js
// (tylko wpisy bez core:true). Dodałeś tam nowy moduł? Dodaj i tu.
const LICENSABLE_MODULES = [
  { key: "hk",       label: "Housekeeping" },
  { key: "klucze",   label: "Klucze / karty" },
  { key: "depozyty", label: "Depozyty" },
  { key: "parking",  label: "Parking" },
  { key: "goscie",   label: "Stali goście" },
  { key: "vouchery", label: "Vouchery" },
  { key: "opinie",   label: "Opinie gości" },
  { key: "sklepik",  label: "Sklepik" },
  { key: "zadania",  label: "Zadania" },
];
const featuresCache = {}; // tenantId -> Set(feature_key) z enabled=true
const linksCache = {}; // tenantId -> [{label,url}] — ostatnio wygenerowane linki tej sesji;
// token nie da się odczytać z powrotem z bazy (RLS deny-by-default na
// tenant_bootstrap_tokens, patrz 0073), więc to jedyna kopia dopóki karta
// jest otwarta w tej samej sesji przeglądarki/appki — stąd cache, nie
// ponowne odpytywanie serwera przy każdym zwinięciu/rozwinięciu sekcji.

// Adres wdrożonych stron telefonów: myhotelos.pl/{token}/{slug}/{page} (bez
// .html — Worker cloudflare/hk-phone/src/worker.js dopisuje je wewnętrznie).
// Token = sekret z superadmin_create_bootstrap_token (poniżej), slug tylko
// kosmetyczny — sanityzowany tu, bo tenants.slug nie ma wymuszonego formatu
// w bazie (0049_tenants.sql).
const sanitizeSlug = s => String(s || "").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "") || "hotel";
const phoneBaseUrl = (token, slug) => `https://myhotelos.pl/${encodeURIComponent(token)}/${sanitizeSlug(slug)}`;
// Strony hk-phone podłączone do dynamicznego tokenu (patrz mint-tenant-token) —
// każda dostaje token w ścieżce. Poza listą celowo:
// - panel.html — stabilny adres myhotelos.pl/panel, bez tokenu w linku (ma
//   realną sesję Supabase Auth, tożsamość tenanta bierze z app_accounts.tenant_id
//   zalogowanego konta, nie z linku, logowanie osobiste per pracownik);
// - sklepik-cenowki.html — nie ma własnego TENANT_ID, to narzędzie do druku
//   otwierane z panelu, nie samodzielna strona tenant-scoped.
const TENANT_PAGES = [
  { page: "index",              label: "Telefon HK / grafik" },
  { page: "posilki",            label: "Posiłki" },
  { page: "posilki-kalendarz",  label: "Posiłki — kalendarz" },
  { page: "konserwacja",        label: "Konserwacja" },
  { page: "wyjazdy",            label: "Wyjazdy" },
];

function showLogin(msg) {
  app.innerHTML = `
    <h1>Operator — Hotele</h1>
    <div class="sub">Panel oddzielny od produktu hotelowego. Tylko dla konta z rolą superadmin.</div>
    <div class="card">
      <div class="field"><label>Login (imię konta superadmin)</label><input id="lname" class="inp" autofocus/></div>
      <div class="field"><label>Hasło</label><input id="lpw" class="inp" type="password"/></div>
      <button class="btn" onclick="doLogin()">Zaloguj</button>
      <div id="lmsg" class="msg ${msg?'err':''}">${esc(msg||"")}</div>
    </div>`;
}
window.doLogin = async () => {
  const name = (document.getElementById("lname")||{}).value || "";
  const pw = (document.getElementById("lpw")||{}).value || "";
  const msgEl = document.getElementById("lmsg");
  const setM = (t) => { if (msgEl) { msgEl.className = "msg err"; msgEl.textContent = t; } };
  if (!name.trim() || !pw) return setM("Wpisz login i hasło.");
  if (pw.length < 6) return setM("Hasło musi mieć min. 6 znaków.");
  const { data: acc } = await sb.from("app_accounts").select("email,claimed").eq("name", name.trim()).maybeSingle();
  if (!acc) return setM("Nie znam takiego konta — załóż je najpierw przez SQL (patrz PANEL_DEPLOY.md).");
  if (acc.claimed) {
    const { error } = await sb.auth.signInWithPassword({ email: acc.email, password: pw });
    if (error) return setM("Błędne hasło.");
  } else {
    // Pierwsze logowanie — ustawia hasło i przejmuje konto (jak panel.html).
    const { error: su } = await sb.auth.signUp({ email: acc.email, password: pw });
    if (su) return setM("Nie udało się założyć hasła: " + su.message);
    const { error: cl } = await sb.rpc("claim_account", { p_email: acc.email, p_code: "" });
    if (cl) return setM("Konto założone, ale nie udało się je przejąć: " + cl.message);
  }
  await afterLogin();
};
async function afterLogin() {
  const { data: role } = await sb.rpc("current_app_role");
  if (role !== "superadmin") {
    await sb.auth.signOut();
    return showLogin("To konto nie ma dostępu do tego panelu (wymagana rola superadmin).");
  }
  loadHotele();
}
(async () => {
  const { data: { user } } = await sb.auth.getUser();
  if (user) return afterLogin();
  showLogin();
})();

// ── Widok „Hotele" (lista) ────────────────────────────────────────────────
let tenantsCache = []; // ostatni wynik superadmin_list_tenants — czyta go widok szczegółu hotelu
let pending = { wa: undefined, modules: {} }; // zmiany wpisane w widoku szczegółu, jeszcze nie zapisane
const fmtD = iso => { if (!iso) return "—"; const d = new Date(iso); const p = n => n<10?"0"+n:""+n; return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`; };

async function refreshTenants() {
  const { data, error } = await sb.rpc("superadmin_list_tenants");
  if (!error) tenantsCache = data || [];
  return !error;
}

async function loadHotele() {
  const ok = await refreshTenants();
  if (!ok) { app.innerHTML = `<div class="msg err">Błąd wczytywania listy hoteli.</div>`; return; }
  const list = tenantsCache.map(r => `
    <div class="hotel" style="cursor:pointer" onclick="openHotel('${r.id}')">
      <div class="hname">${esc(r.name)} <span class="status ${esc(r.status)}">${esc(STATUS_LBL[r.status]||r.status)}</span></div>
      <div class="hmeta">slug: ${esc(r.slug)} · plan: ${esc(r.plan)} · opłacone/próba do: ${fmtD(r.trial_ends_at)}</div>
    </div>`).join("") || '<div class="empty">Brak hoteli.</div>';
  app.innerHTML = `
    <h1>Operator — Hotele <a class="logout" style="display:inline" onclick="doLogout()">wyloguj</a></h1>
    <div class="sub">Kokpit właściciela SaaS — poza produktem hotelowym. Kliknij hotel, żeby wejść w jego ustawienia.</div>
    <div class="card">
      <label>Dodaj hotel</label>
      <div class="row" style="margin-top:8px">
        <input id="thName" class="inp" placeholder="Nazwa (np. Hotel Górski)" style="flex:1;min-width:160px"/>
        <input id="thSlug" class="inp" placeholder="slug (np. hotel-gorski)" style="flex:1;min-width:160px"/>
        <button class="btn small" onclick="addHotel()">Dodaj (7 dni próby)</button>
      </div>
      <div id="thMsg" class="msg"></div>
    </div>
    <div class="card">${list}</div>`;
}
window.doLogout = async () => { await sb.auth.signOut(); showLogin(); };
window.addHotel = async () => {
  const name = (document.getElementById("thName")||{}).value || "";
  const slug = (document.getElementById("thSlug")||{}).value || "";
  const msgEl = document.getElementById("thMsg");
  if (!name.trim() || !slug.trim()) { if (msgEl){ msgEl.className="msg err"; msgEl.textContent="Podaj nazwę i slug."; } return; }
  const { error } = await sb.rpc("superadmin_create_tenant", { p_name: name.trim(), p_slug: slug.trim() });
  if (error) { if (msgEl){ msgEl.className="msg err"; msgEl.textContent = error.message; } return; }
  loadHotele();
};

// ── Widok szczegółu jednego hotelu (pełny ekran, wchodzi się kliknięciem z listy) ─
window.openHotel = async (tenantId) => {
  pending = { wa: undefined, modules: {} };
  if (!featuresCache[tenantId]) {
    const { data, error } = await sb.rpc("superadmin_list_tenant_features", { p_tenant_id: tenantId });
    featuresCache[tenantId] = error ? new Set() : new Set((data||[]).filter(r => r.enabled).map(r => r.feature_key));
  }
  renderHotelDetail(tenantId);
};

function buildDetailDiff(t) {
  const lines = [];
  if (pending.wa !== undefined && pending.wa.trim() !== (t.whatsapp_number||"").trim()) {
    lines.push(`Numer WhatsApp: „${t.whatsapp_number||"—"}" → „${pending.wa.trim()||"—"}"`);
  }
  Object.keys(pending.modules).forEach(k => {
    const m = LICENSABLE_MODULES.find(x => x.key === k);
    lines.push(`Moduł „${m?m.label:k}": ${pending.modules[k] ? "włączyć" : "wyłączyć"}`);
  });
  return lines;
}

function renderHotelDetail(tenantId, flashMsg) {
  const t = tenantsCache.find(r => r.id === tenantId);
  if (!t) return loadHotele();
  const susp = t.status === "suspended";
  const enabledSet = featuresCache[tenantId] || new Set();
  const modRows = LICENSABLE_MODULES.map(m => {
    const isOn = pending.modules.hasOwnProperty(m.key) ? pending.modules[m.key] : enabledSet.has(m.key);
    return `<label style="display:flex;align-items:center;gap:7px;padding:4px 0;font-weight:600;font-size:13px">
      <input type="checkbox" ${isOn?"checked":""} onchange="stageModule('${tenantId}','${m.key}',this.checked)"/>
      ${esc(m.label)}
    </label>`;
  }).join("");
  app.innerHTML = `
    <a class="logout" style="display:block;margin-bottom:10px;cursor:pointer" onclick="loadHotele()">← Wstecz do listy</a>
    <h1>${esc(t.name)} <span class="status ${esc(t.status)}">${esc(STATUS_LBL[t.status]||t.status)}</span></h1>
    <div class="sub">slug: ${esc(t.slug)} · plan: ${esc(t.plan)} · opłacone/próba do: ${fmtD(t.trial_ends_at)}</div>
    ${flashMsg ? `<div class="msg info">${esc(flashMsg)}</div>` : ""}
    <div class="card">
      <label>Numer WhatsApp bota</label>
      <input class="inp" value="${esc(pending.wa !== undefined ? pending.wa : (t.whatsapp_number||""))}" oninput="pending.wa = this.value" placeholder="np. 48123456789"/>
    </div>
    <div class="card">
      <label>Status / ważność</label>
      <div class="row" style="margin-top:8px">
        <button class="btn small ghost" onclick="setTrialEnds('${tenantId}','${esc(t.name)}')">Zmień datę opłacone/próba do</button>
        <button class="btn small ${susp?"ok":"danger"}" onclick="toggleKill('${tenantId}','${esc(t.name)}', ${susp})">${susp?"Włącz z powrotem":"Wyłącz teraz"}</button>
      </div>
    </div>
    <div class="card">
      <label>Moduły</label>
      ${modRows}
    </div>
    <div class="card">
      <div class="row" style="margin-top:0">
        <button class="btn small ghost" onclick="toggleLinks('${tenantId}','${esc(t.name)}')">Linki dla tego hotelu</button>
      </div>
      <div id="lnk-${tenantId}" style="display:none;margin-top:8px"></div>
    </div>
    <button class="btn ok" style="margin-top:6px" onclick="saveDetailChanges('${tenantId}')">Zapisz i potwierdź</button>`;
}

window.stageModule = (tenantId, key, checked) => {
  const orig = (featuresCache[tenantId] || new Set()).has(key);
  if (checked === orig) delete pending.modules[key]; else pending.modules[key] = checked;
};

window.saveDetailChanges = async (tenantId) => {
  const t = tenantsCache.find(r => r.id === tenantId);
  if (!t) return;
  const lines = buildDetailDiff(t);
  if (!lines.length) { alert("Brak zmian do zapisania."); return; }
  const ok = confirm(`Zapisać zmiany dla „${t.name}"?\n\n${lines.join("\n")}`);
  if (!ok) return;
  if (pending.wa !== undefined && pending.wa.trim() !== (t.whatsapp_number||"").trim()) {
    const { error } = await sb.rpc("superadmin_set_tenant_whatsapp", { p_tenant_id: tenantId, p_number: pending.wa.trim() });
    if (error) return alert("Błąd zapisu numeru: " + error.message);
  }
  for (const key of Object.keys(pending.modules)) {
    const enabled = pending.modules[key];
    const { error } = await sb.rpc("superadmin_set_tenant_feature", { p_tenant_id: tenantId, p_feature_key: key, p_enabled: enabled });
    if (error) return alert(`Błąd zapisu modułu ${key}: ` + error.message);
    if (enabled) featuresCache[tenantId].add(key); else featuresCache[tenantId].delete(key);
  }
  pending = { wa: undefined, modules: {} };
  await refreshTenants();
  renderHotelDetail(tenantId, "Zapisano zmiany.");
};

window.setTrialEnds = async (tenantId, name) => {
  const v = prompt(`Data opłacone/próba do dla „${name}" (RRRR-MM-DD):`);
  if (!v) return;
  const { error } = await sb.rpc("superadmin_set_tenant_trial_ends", { p_tenant_id: tenantId, p_trial_ends_at: v.trim() + "T23:59:59" });
  if (error) return alert("Zła data lub błąd: " + error.message);
  await refreshTenants();
  renderHotelDetail(tenantId, "Data zaktualizowana.");
};
window.toggleKill = async (tenantId, name, isSuspended) => {
  const next = isSuspended ? "active" : "suspended";
  const ok = confirm(isSuspended ? `Włączyć z powrotem „${name}"?` : `WYŁĄCZYĆ „${name}" natychmiast? Stracą dostęp do aplikacji.`);
  if (!ok) return;
  const { error } = await sb.rpc("superadmin_set_tenant_status", { p_tenant_id: tenantId, p_status: next });
  if (error) return alert("Błąd: " + error.message);
  await refreshTenants();
  renderHotelDetail(tenantId, next === "suspended" ? "Hotel wyłączony." : "Hotel włączony.");
};

// ── Linki dla hotelu (bootstrap token → gotowe URL-e stron hk-phone) ───────
window.toggleLinks = (tenantId, name) => {
  const box = document.getElementById(`lnk-${tenantId}`);
  if (!box) return;
  const willOpen = box.style.display === "none";
  if (willOpen) {
    if (linksCache[tenantId]) {
      renderLinks(tenantId, name);
    } else {
      box.innerHTML = `<button class="btn small" onclick="genLink('${tenantId}','${esc(name)}')">Wygeneruj link dla „${esc(name)}"</button><div class="msg"></div>`;
    }
  }
  box.style.display = willOpen ? "block" : "none";
};

window.genLink = async (tenantId, name) => {
  const box = document.getElementById(`lnk-${tenantId}`);
  const msgEl = box?.querySelector(".msg");
  const { data: token, error } = await sb.rpc("superadmin_create_bootstrap_token", { p_tenant_id: tenantId, p_label: name });
  if (error) { if (msgEl) { msgEl.className = "msg err"; msgEl.textContent = "Błąd: " + error.message; } return; }
  const t = tenantsCache.find(r => r.id === tenantId);
  const base = phoneBaseUrl(token, t && t.slug);
  linksCache[tenantId] = TENANT_PAGES.map(p => ({
    label: p.label,
    url: `${base}/${p.page}`,
  }));
  renderLinks(tenantId, name);
};

function renderLinks(tenantId, name) {
  const box = document.getElementById(`lnk-${tenantId}`);
  if (!box) return;
  const links = linksCache[tenantId] || [];
  const rows = links.map(l => `<div style="display:flex;align-items:center;gap:8px;padding:4px 0">
      <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12.5px">${esc(l.label)}</div>
      <div style="color:var(--muted);font-size:11px;word-break:break-all">${esc(l.url)}</div></div>
      <button class="btn small ghost" onclick="copyLink(this,'${esc(l.url)}')">Kopiuj</button>
    </div>`).join("");
  box.innerHTML = `<div class="msg info" style="margin-bottom:6px">Token wygenerowany. Zapisz linki — token nie da się później ponownie wyświetlić w tej formie (widoczny tylko dopóki ta karta jest rozwinięta w tej sesji; po zamknięciu appki trzeba wygenerować nowy).</div>
    ${rows}
    <div class="row" style="margin-top:6px">
      <button class="btn small" onclick="copyAllLinks('${tenantId}')">Kopiuj wszystkie</button>
      <button class="btn small ghost" onclick="genLink('${tenantId}','${esc(name)}')">Wygeneruj nowy (stare linki zostają aktywne)</button>
    </div>`;
}

window.copyLink = async (btn, url) => {
  try {
    await navigator.clipboard.writeText(url);
    const prev = btn.textContent;
    btn.textContent = "Skopiowano!";
    setTimeout(() => { btn.textContent = prev; }, 1500);
  } catch (e) {
    prompt("Skopiuj ręcznie:", url);
  }
};

window.copyAllLinks = async (tenantId) => {
  const links = linksCache[tenantId] || [];
  const text = links.map(l => `${l.label}: ${l.url}`).join("\n");
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    prompt("Skopiuj ręcznie:", text);
  }
};
</script>
</body>
</html>
