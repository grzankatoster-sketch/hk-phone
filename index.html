<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Recepcji — Conrad Comfort</title>
    <script>
      // ── Theme boot (sekcja 35) — read cc.theme or prefers-color-scheme ─────
      // Wykonuje się synchronicznie PRZED renderem aby uniknąć FOUC.
      (function(){
        try{
          var stored=localStorage.getItem("cc.theme");
          var prefersDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark=stored==="dark"||(stored==null&&prefersDark);
          var html=document.documentElement;
          html.classList.add(dark?"theme-dark":"theme-light");
          if(dark)document.documentElement.style.colorScheme="dark";
        }catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
